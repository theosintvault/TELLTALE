name: Deploy to Tencent Kubernetes Engine

on:
  push:
    branches:
      - main

env:
  TKE_IMAGE_URL: ccr.ccs.tencentyun.com/your-namespace/your-repo
  TKE_REGION: ap-guangzhou
  TKE_CLUSTER_ID: cls-example123
  DEPLOYMENT_NAME: telltale-app

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_CLOUD_ACCOUNT_ID }}
          password: ${{ secrets.TKE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $TKE_IMAGE_URL:$IMAGE_TAG -t $TKE_IMAGE_URL:latest .
          docker push $TKE_IMAGE_URL:$IMAGE_TAG
          docker push $TKE_IMAGE_URL:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure cluster context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy image update to TKE
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME $DEPLOYMENT_NAME=$TKE_IMAGE_URL:${{ github.sha }}
          kubectl rollout status deployment/$DEPLOYMENT_NAME --timeout=300s
